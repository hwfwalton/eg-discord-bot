# Production deployment. Put a `.env` file next to this one (see .env.example for what each
# setting does) containing at least:
#   DISCORD_TOKEN=<the bot token>
#   GUILD_IDS=<your server's ID>
# plus the channel IDs and API keys for the features you want. A feature whose settings are left
# out stays off.
services:
  bot:
    # Built and published by GitHub Actions (.github/workflows/ci.yml) after the tests pass on master.
    # `always` makes every `docker compose up` (or a UGOS Redeploy) fetch the newest image. To roll back,
    # use an older commit's tag instead of `latest`, e.g. ghcr.io/hwfwalton/eg-discord-bot:sha-1234567.
    # To run your own build instead, replace these two lines with `build: .`.
    image: ghcr.io/hwfwalton/eg-discord-bot:latest
    pull_policy: always
    container_name: eg-discord-bot
    restart: unless-stopped
    init: true
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in a .env file next to docker-compose.yml}
      GUILD_IDS: ${GUILD_IDS:?Set GUILD_IDS in a .env file next to docker-compose.yml}
      # Game night reminder (set both channel IDs, or neither; schedule and timezone have defaults)
      GAME_NIGHT_ANNOUNCEMENTS_CHANNEL_ID: ${GAME_NIGHT_ANNOUNCEMENTS_CHANNEL_ID:-}
      GAME_NIGHT_CHANNEL_ID: ${GAME_NIGHT_CHANNEL_ID:-}
      GAME_NIGHT_SCHEDULE: ${GAME_NIGHT_SCHEDULE:-}
      GAME_NIGHT_TIMEZONE: ${GAME_NIGHT_TIMEZONE:-}
      # Claude: reads unusual announcements, researches players and mods
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      # Game info in the game ideas forum
      GAME_SUGGESTIONS_CHANNEL_ID: ${GAME_SUGGESTIONS_CHANNEL_ID:-}
      ITAD_API_KEY: ${ITAD_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
